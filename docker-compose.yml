services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sherlock

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "*123456HAS*"
      MSSQL_PID: "Developer"

    ports:
      - "1433:1433"

    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  sqlserver_data: