<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Investigação Florence — Distribuição de Caso</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body class="dark-bg">
  <div class="grain"></div>
  <header class="topbar">
    <div class="brand">FLORENCE <span>///</span></div>
    <div class="user-badge" id="userBadge"></div>
  </header>
  <main class="center-screen">
    <section class="roulette-card">
      <div class="case-tag">DISTRIBUIÇÃO ALEATÓRIA</div>
      <h1>Seleção do Caso</h1>
      <p class="muted">A roleta determinará qual investigação será atribuída.</p>
      <div class="roulette-wrap">
        <div class="pointer"></div>
        <div class="wheel" id="wheel">
          <div class="wheel-label label-fraud" data-categoria="fraude" data-caso-id="1">
            FRAUDE
          </div>

          <div class="wheel-label label-genocide" data-categoria="genocidio" data-caso-id="2">
            GENOCÍDIO
          </div>

          <div class="wheel-label label-murder" data-categoria="assassinato" data-caso-id="3">
            ASSASSINATO
          </div>
        </div>
      </div>
      <button id="spinBtn" class="btn primary">GIRAR ROLETA</button>
      <p id="result" class="result-text"></p>
    </section>
  </main>
  <script src="/js/roleta.js"></script>
</body>

</html>
